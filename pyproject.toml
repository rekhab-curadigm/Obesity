[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obesity-target-discovery"
version = "0.1.0"
description = "Human-in-the-loop evidence integration for obesity target discovery"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "openpyxl>=3.1,<4",
    "pandas>=1.4,<4",
    "streamlit>=1.40,<2",
    "streamlit-aggrid>=1.1.9,<2",
]

[project.scripts]
target-discovery = "target_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["target_discovery*"]